<div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
 
 
          <div class="card-header text-center">
            <h3>Register</h3>
          </div>
 
          <div class="card-body">
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
              <!-- Email Field -->
              <div class="form-group">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  formControlName="email"
                  placeholder="Enter your email"
                />
                <div *ngIf="registerForm.get('email').invalid && registerForm.get('email').touched" class="error-message">
                  Please enter a valid email.
                </div>
              </div>
 
 
 
              <!-- Password Field -->
              <div class="form-group">
                <label for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  formControlName="password"
                  placeholder="Enter your password"
                />
                <div *ngIf="registerForm.get('password').invalid && registerForm.get('password').touched" class="error-message">
                  Password is required.
                </div>
              </div>
 
              <!-- Re-enter Password Field -->
              <div class="form-group">
                <label for="confirmPassword">Re-enter Password</label>
                <input
                  type="password"
                  id="confirmPassword"
                  class="form-control"
                  formControlName="confirmPassword"
                  placeholder="Re-enter your password"
                />
                <div *ngIf="registerForm.get('confirmPassword').invalid && registerForm.get('confirmPassword').touched" class="error-message">
                  Please re-enter your password.
                </div>
                <div *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword').touched" class="error-message">
                  Passwords do not match.
                </div>
              </div>
 
              <!-- Role Field -->
              <div class="form-group">
                <label for="role">Role</label>
                <select
                  id="role"
                  class="form-control"
                  formControlName="role"
                >
                  <option value="">Select Role</option>
                  <option value="admin">Admin</option>
                  <option value="jobseeker">Job Seeker</option>
                  <option value="employer">Employer</option>
                </select>
                <div *ngIf="registerForm.get('role').invalid && registerForm.get('role').touched" class="error-message">
                  Please select a role.
                </div>
              </div>
 
          <div class="mt-3 d-flex justify-content-between">
            <button (click)="onSubmit()" class="btn btn-primary w-48">
              Register
            </button>
            <button (click)="goToLogin()" class="btn btn-secondary w-48 ms-3">
              Back to Login
            </button>
          </div>
        </form>
 
        <div *ngIf="formSubmitted" class="alert alert-success mt-3 text-center">
          Form submitted successfully!
        </div>
 
          </div>
        </div>
      </div>
    </div>
